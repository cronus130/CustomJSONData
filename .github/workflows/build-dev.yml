name: Build Dev

on:
  workflow_dispatch:
    inputs:
      game-version:
        description: "Beat Saber version to build against"
        required: true
        default: "1.42.1"
        type: string
  push:
    branches: [ "master" ]
    paths:
    - .github/workflows/build-dev.yml
    - CustomJSONData/**
    - CustomJSONData.sln

jobs:
  build:
    name: Build
    strategy:
      matrix:
        game-version: [ "${{ inputs.game-version || '1.42.1' }}" ]
    uses: Aeroluna/workflows/.github/workflows/bs-build-version-release.yml@main
    with:
      project-path: CustomJSONData/CustomJSONData.csproj
      game-version: ${{ matrix.game-version }}
    secrets: inherit
